<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup Juguetico v2 — MUTEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --achiote: #FF6927;
    --sacbe:   #EAE6DB;
    --dark:    #2D2520;
    --mid:     #6B5E54;
    --magenta: #E5007E;
    --durazno: #FFCC71;
    --cian:    #009EE2;
    --paint-bg: var(--sacbe);
    --paint-fg: #000000;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
    background: #444;
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }

  /* Faux fondo página museo */
  .museum-bg {
    position: fixed; inset: 0;
    background: var(--sacbe);
    background-image:
      radial-gradient(rgba(45,37,32,0.04) 1px, transparent 1px),
      radial-gradient(rgba(45,37,32,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
    z-index: 0;
  }
  .museum-bg::after {
    content: 'Página del Museo (WordPress)';
    position: absolute; top: 50%; left: 60%;
    transform: translate(-50%, -50%);
    font-size: 28px; color: rgba(45,37,32,0.18);
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* Bookmark vertical (WordPress lo renderizaría) */
  .bookmark {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 28px;
    background: var(--dark);
    z-index: 60;
    display: flex; align-items: center; justify-content: center;
  }
  .bookmark__text {
    color: var(--sacbe);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 12px;
    letter-spacing: 0.08em;
    font-style: italic;
    user-select: none;
  }
  .bookmark__text .dot { font-style: normal; margin: 0 6px; }

  /* Overlay del juguetico */
  .overlay {
    position: fixed;
    top: 0; bottom: 0; left: 28px;
    width: min(72vw, calc(100vh + 32px));
    background: var(--dark);
    z-index: 50;
    display: flex;
    align-items: stretch;
    padding: 12px 12px 12px 8px;
    transition: width 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    transform: translateX(0);
  }
  .overlay.collapsed {
    transform: translateX(calc(-100% - 28px));
    padding: 0;
    overflow: hidden;
    transition: transform 0.45s cubic-bezier(0.7, 0, 0.84, 0);
  }

  /* Content choreography */
  .overlay .sidebar,
  .overlay .canvas-area,
  .overlay .frame__close {
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 1;
    transform: translateX(0);
  }
  .overlay.collapsed .sidebar,
  .overlay.collapsed .canvas-area,
  .overlay.collapsed .frame__close {
    opacity: 0;
    transform: translateX(-30px);
    transition: opacity 0.15s ease, transform 0.2s ease;
  }

  /* Staggered entrance for sidebar buttons */
  .overlay .side-btn {
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .overlay.collapsed .side-btn {
    opacity: 0;
    transform: translateY(8px) scale(0.9);
    transition: opacity 0.1s ease, transform 0.15s ease;
  }
  .overlay:not(.collapsed) .side-btn:nth-child(1) { transition-delay: 0.12s; }
  .overlay:not(.collapsed) .side-btn:nth-child(2) { transition-delay: 0.15s; }
  .overlay:not(.collapsed) .side-btn:nth-child(3) { transition-delay: 0.18s; }
  .overlay:not(.collapsed) .side-btn:nth-child(4) { transition-delay: 0.21s; }
  .overlay:not(.collapsed) .side-btn:nth-child(5) { transition-delay: 0.24s; }
  .overlay:not(.collapsed) .side-btn:nth-child(6) { transition-delay: 0.27s; }
  .overlay:not(.collapsed) .side-btn:nth-child(7) { transition-delay: 0.30s; }
  .overlay:not(.collapsed) .side-btn:nth-child(8) { transition-delay: 0.33s; }
  .overlay:not(.collapsed) .side-btn:nth-child(9) { transition-delay: 0.36s; }

  /* Canvas area entrance */
  .overlay:not(.collapsed) .canvas-area { transition-delay: 0.1s; }
  .overlay:not(.collapsed) .frame__close { transition-delay: 0.35s; }

  /* Botón cerrar — dentro del canvas */
  .frame__close {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 4;
    width: 28px; height: 28px;
    background: rgba(45,37,32,0.55);
    border: none;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(234,230,219,0.7);
    transition: background 0.2s, color 0.2s;
  }
  .frame__close:hover { background: rgba(45,37,32,0.85); color: var(--sacbe); }

  /* Sidebar de 8 botones */
  .sidebar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0;
    z-index: 2;
  }
  .side-btn {
    width: 32px; height: 32px;
    background: transparent;
    border: none;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--sacbe);
    transition: background 0.15s;
    position: relative;
  }
  .side-btn:hover { background: rgba(255,255,255,0.08); }
  .side-btn.active {
    background: var(--achiote);
    color: #fff;
  }
  .side-btn svg { display: block; }
  .side-btn[data-open="true"] {
    background: rgba(255,255,255,0.12);
  }

  /* Canvas area */
  .canvas-area {
    flex: 1;
    background: var(--paint-bg);
    border-radius: 16px;
    display: block;
    position: relative;
    margin-left: 4px;
    overflow: hidden;
    transition: background 0.2s;
  }
  .canvas-wrap {
    position: absolute;
    inset: 0;
    transform-origin: center center;
    transition: transform 0.2s ease;
  }
  #grid-svg {
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
    display: block;
  }

  /* Popovers */
  .popover {
    position: absolute;
    left: 52px;
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    z-index: 5;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .popover[hidden] { display: none; }
  .popover::before {
    content: '';
    position: absolute;
    left: -6px;
    top: 14px;
    width: 12px; height: 12px;
    background: #fff;
    transform: rotate(45deg);
  }


  .swatch {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: var(--sacbe);
    transition: transform 0.15s, border-color 0.15s;
    padding: 0;
    position: relative;
  }
  .swatch:hover { transform: translateY(-1px); }
  .swatch.active { border-color: var(--achiote); }
  .swatch::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 18px; height: 18px;
    transform: translate(-50%, -50%);
    background: #000;
    border-radius: 50%;
  }

  .dl-btn {
    background: var(--achiote);
    color: #fff;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
  }
  .dl-btn.alt { background: rgba(255,105,39,0.25); color: var(--achiote); }
  .dl-btn:hover { filter: brightness(1.05); }

  .canvas-hint {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
    pointer-events: none;
    text-align: center;
    padding: 20px;
  }
  .canvas-hint span {
    font-size: 15px;
    color: var(--mid);
    opacity: 0.6;
    letter-spacing: 0.02em;
    line-height: 1.5;
  }
  .empty-toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, 12px);
    margin-top: 20px;
    background: var(--dark);
    color: var(--sacbe);
    font-size: 12px;
    line-height: 1.4;
    padding: 8px 16px;
    border-radius: 8px;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    white-space: nowrap;
  }
  .empty-toast.show {
    opacity: 1;
  }

  /* ——— Responsive mobile ——— */
  @media (max-width: 640px) {
    .bookmark {
      top: auto; bottom: 0; left: 0; right: 0;
      width: auto; height: 44px;
    }
    .bookmark__text {
      writing-mode: horizontal-tb;
      transform: none;
      font-size: 11px;
    }
    .overlay {
      top: 0; bottom: 0; left: 0; right: 0;
      width: auto;
      z-index: 70;
      flex-direction: column;
      padding: 12px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      transform: translateY(0);
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .overlay.collapsed {
      transform: translateY(100%);
      padding: 12px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      overflow: visible;
      transition: transform 0.45s cubic-bezier(0.7, 0, 0.84, 0);
    }
    .overlay .sidebar,
    .overlay .canvas-area,
    .overlay .frame__close {
      transform: translateY(0);
    }
    .overlay.collapsed .sidebar,
    .overlay.collapsed .canvas-area,
    .overlay.collapsed .frame__close {
      transform: translateY(30px);
    }
    .overlay .side-btn {
      transform: translateX(0) scale(1);
    }
    .overlay.collapsed .side-btn {
      transform: translateX(0) scale(0.9);
    }
    .sidebar {
      flex-direction: row;
      order: 2;
      justify-content: center;
      padding: 6px 0 2px;
      gap: 2px;
    }
    .side-btn {
      width: 36px; height: 36px;
    }
    .canvas-area {
      order: 1;
      margin: 0;
      flex: 1;
      border-radius: 14px;
    }
    .frame__close {
      top: 6px; right: 6px;
    }
    .popover {
      left: auto;
      bottom: 52px;
      top: auto !important;
    }
    .popover::before {
      left: 50%;
      top: auto;
      bottom: -6px;
      transform: translateX(-50%) rotate(45deg);
    }
  }

  /* Modal compartir */
  .modal {
    position: fixed; inset: 0;
    background: rgba(45,37,32,0.6);
    z-index: 80;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal[hidden] { display: none; }
  .modal__box {
    background: #fff;
    border-radius: 16px;
    padding: 26px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    position: relative;
  }
  .modal__close {
    position: absolute; top: 14px; right: 14px;
    background: none; border: none; color: var(--mid); padding: 4px;
  }
  .modal h3 { margin: 0 0 8px; font-size: 18px; letter-spacing: -0.01em; }
  .modal p.intro { margin: 0 0 18px; font-size: 13px; color: var(--mid); line-height: 1.5; }
  .modal input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid rgba(45,37,32,0.15);
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 14px;
  }
  .modal__submit {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--achiote);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .modal__gallery {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 1.5px solid var(--achiote);
    background: transparent;
    color: var(--achiote);
    font-size: 13px;
    font-weight: 600;
  }

</style>
</head>
<body>

<div class="museum-bg" aria-hidden="true"></div>

<!-- Bookmark base — Wordpress lo renderizaría siempre -->
<div class="bookmark" id="bookmark" role="button" tabindex="0" aria-label="Abrir juguetico">
  <span class="bookmark__text"><em>abstrae</em> <span class="dot">◆</span> <em>traza</em> <span class="dot">◆</span> <em>juega</em></span>
</div>

<!-- Overlay del juguetico expandido -->
<div class="overlay" id="overlay">

  <div class="sidebar">
    <!-- 1: color -->
    <button class="side-btn" data-action="palette" aria-label="Color">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
    <!-- 3: zoom in -->
    <button class="side-btn" data-action="zoomIn" aria-label="Zoom in">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m20 20-4-4"/><path d="M10.5 7.5v6"/><path d="M7.5 10.5h6"/></svg>
    </button>
    <!-- 4: zoom out -->
    <button class="side-btn" data-action="zoomOut" aria-label="Zoom out">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m20 20-4-4"/><path d="M7.5 10.5h6"/></svg>
    </button>
    <!-- 4: deshacer -->
    <button class="side-btn" data-action="undo" aria-label="Deshacer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
    <!-- 5: limpiar -->
    <button class="side-btn" data-action="clear" aria-label="Limpiar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
    <!-- 5: espejo H -->
    <button class="side-btn" data-action="mirrorH" aria-label="Espejo horizontal">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/><path d="M12 2v20"/></svg>
    </button>
    <!-- 6: espejo V -->
    <button class="side-btn" data-action="mirrorV" aria-label="Espejo vertical">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1"/><rect x="4" y="14" width="16" height="7" rx="1"/><path d="M2 12h20"/></svg>
    </button>
    <!-- 7: compartir -->
    <button class="side-btn" data-action="share" aria-label="Compartir">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
    <!-- 8: descargar -->
    <button class="side-btn" data-action="download" aria-label="Descargar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>

    <!-- Popovers -->
    <div class="popover" id="pop-palette" hidden style="top: 50px;">
      <button class="swatch active" data-pal="1" style="background: var(--sacbe)"></button>
      <button class="swatch" data-pal="2" style="background: var(--magenta)"></button>
      <button class="swatch" data-pal="3" style="background: var(--durazno)"></button>
      <button class="swatch" data-pal="4" style="background: var(--cian)"></button>
    </div>

    <div class="popover" id="pop-download" hidden style="top: 400px;">
      <button class="dl-btn" id="dl-jpg">
        <svg width="16" height="16" viewBox="0 0 24 24" style="margin-right:6px;vertical-align:-3px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m5 12 7 7 7-7"/></svg>JPG
      </button>
      <button class="dl-btn alt" id="dl-svg">SVG</button>
    </div>
  </div>

  <div class="canvas-area">
    <div class="canvas-hint" id="canvas-hint"><span>Toca los rombos para crear tu diseño textil</span></div>
    <div class="empty-toast" id="empty-toast">Crea tu diseño primero para poder compartirlo o descargarlo.</div>
    <div class="canvas-wrap">
      <svg id="grid-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <button class="frame__close" id="btn-close" aria-label="Cerrar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    </button>
  </div>

</div>

<!-- Modal compartir -->
<div class="modal" id="modal-share" hidden>
  <div class="modal__box">
    <button class="modal__close" id="modal-share-close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <h3>Comparte tu diseño con nosotros</h3>
    <p class="intro">Ingresa tu correo electrónico y tu diseño se exhibirá en la galería colectiva del museo.</p>
    <input type="email" placeholder="tu@correo.com">
    <p style="font-size:11px;color:var(--mid);text-align:left;margin:0 0 14px;line-height:1.4;">Acepto <a href="#" style="color:var(--achiote)">términos</a> y <a href="#" style="color:var(--achiote)">política de privacidad</a></p>
    <button class="modal__submit">Compartir</button>
    <button class="modal__gallery">Galería</button>
  </div>
</div>



<script>
(function () {
  // CS = "cell size" del rombo (radio). Los presets cambian CS, y rows/cols
  // se recalculan para llenar exactamente la zona beige.
  var CS_PRESETS = [10, 14, 20, 30]; // fino → medio → amplio → grande
  var CS = CS_PRESETS[2];
  var rows = 0, cols = 0;
  var grid = [];
  function fitGrid() {
    var area = document.querySelector('.canvas-area');
    var rect = area.getBoundingClientRect();
    if (!rect.width || !rect.height) return false;
    var newCols = Math.max(4, Math.ceil(rect.width / (2 * CS)) + 1);
    var newRows = Math.max(4, Math.ceil(rect.height / CS) + 2);
    if (newRows === rows && newCols === cols && grid.length) return false;
    var ng = [];
    for (var r = 0; r < newRows; r++) {
      var row = [];
      for (var c = 0; c < newCols; c++) {
        row.push((grid[r] && grid[r][c]) ? 1 : 0);
      }
      ng.push(row);
    }
    rows = newRows; cols = newCols; grid = ng;
    return true;
  }
  fitGrid();


  function cellCenter(r, c) {
    return { cx: c*2*CS + (r%2 ? CS : 0), cy: r*CS };
  }
  function diamondPts(cx, cy) {
    return cx+','+(cy-CS)+' '+(cx+CS)+','+cy+' '+cx+','+(cy+CS)+' '+(cx-CS)+','+cy;
  }
  function makeGrid() {
    grid = [];
    for (var r = 0; r < rows; r++) {
      var row = [];
      for (var c = 0; c < cols; c++) row.push(0);
      grid.push(row);
    }
  }

  function render() {
    var svg = document.getElementById('grid-svg');
    var gridW = (cols - 1) * 2 * CS + 2 * CS;
    var gridH = (rows - 1) * CS + 2 * CS;
    svg.setAttribute('viewBox', (-CS) + ' ' + (-CS) + ' ' + gridW + ' ' + gridH);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    var html = '';
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--paint-bg').trim();
    var fg = getComputedStyle(document.documentElement).getPropertyValue('--paint-fg').trim();
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var cc = cellCenter(r, c);
        var fill = grid[r][c] ? fg : bg;
        html += '<polygon data-r="'+r+'" data-c="'+c+'" points="'+diamondPts(cc.cx, cc.cy)+'" fill="'+fill+'" stroke="rgba(45,37,32,0.10)" stroke-width="0.5"/>';
      }
    }
    svg.innerHTML = html;
  }
  render();

  var zoomIdx = 0;

  var undoStack = [];
  function saveUndo() {
    undoStack.push(grid.map(function(r){ return r.slice(); }));
    if (undoStack.length > 50) undoStack.shift();
  }

  // Dibujo — pointerdown fija el modo (pintar/borrar) según el estado de la celda tocada
  var drawing = false, drawVal = 1;
  function svgCoords(e) {
    var svg = document.getElementById('grid-svg');
    var pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    var svgPt = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: svgPt.x, y: svgPt.y };
  }
  var mirrorHActive = false;
  var mirrorVActive = false;

  function mirrorColFor(r, c) {
    var mc = (r % 2 === 0) ? cols - 1 - c : cols - 2 - c;
    return (mc >= 0 && mc < cols) ? mc : -1;
  }

  function paintCell(r, c) {
    if (r < 0 || r >= rows || c < 0 || c >= cols) return;
    grid[r][c] = drawVal;
  }

  function hit(e) {
    var p = svgCoords(e);
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var cc = cellCenter(r, c);
        if (Math.abs(p.x - cc.cx)/CS + Math.abs(p.y - cc.cy)/CS <= 1) {
          paintCell(r, c);
          var mr = rows - 1 - r;
          if (mirrorHActive) {
            var mc = mirrorColFor(r, c);
            if (mc >= 0) paintCell(r, mc);
          }
          if (mirrorVActive) {
            paintCell(mr, c);
          }
          render();
          return;
        }
      }
    }
  }
  var svg = document.getElementById('grid-svg');
  svg.addEventListener('pointerdown', function(e) {
    var hint = document.getElementById('canvas-hint');
    if (hint) hint.remove();
    saveUndo();
    drawing = true;
    var p = svgCoords(e);
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var cc = cellCenter(r, c);
        if (Math.abs(p.x - cc.cx)/CS + Math.abs(p.y - cc.cy)/CS <= 1) {
          drawVal = grid[r][c] ? 0 : 1;
          break;
        }
      }
      if (drawVal !== undefined) break;
    }
    hit(e);
  });
  svg.addEventListener('pointermove', function(e){ if (drawing) hit(e); });
  window.addEventListener('pointerup', function(){ drawing = false; });

  // Acciones del sidebar
  function isCanvasEmpty() {
    for (var r = 0; r < rows; r++)
      for (var c = 0; c < cols; c++)
        if (grid[r][c]) return false;
    return true;
  }
  var toastTimer = null;
  function showEmptyToast() {
    var t = document.getElementById('empty-toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 4000);
  }

  var openPop = null;
  function closeAllPopovers() {
    ['pop-palette','pop-download'].forEach(function(id){
      document.getElementById(id).hidden = true;
    });
    document.querySelectorAll('.side-btn').forEach(function(b){ b.removeAttribute('data-open'); });
    openPop = null;
  }
  function togglePop(id, btn) {
    if (openPop === id) { closeAllPopovers(); return; }
    closeAllPopovers();
    var pop = document.getElementById(id);
    var isMobile = window.innerWidth <= 640;
    if (isMobile) {
      var sidebar = btn.closest('.sidebar');
      var btnRect = btn.getBoundingClientRect();
      var sidebarRect = sidebar.getBoundingClientRect();
      var btnLeft = btnRect.left - sidebarRect.left + btnRect.width / 2;
      pop.style.top = '';
      pop.style.left = Math.max(8, btnLeft - pop.offsetWidth / 2) + 'px';
    } else {
      var sidebar = btn.closest('.sidebar');
      var btnTop = btn.getBoundingClientRect().top - sidebar.getBoundingClientRect().top;
      pop.style.top = btnTop + 'px';
      pop.style.left = '';
    }
    pop.hidden = false;
    btn.setAttribute('data-open', 'true');
    openPop = id;
  }
  document.querySelectorAll('.side-btn').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var act = btn.dataset.action;
      if (act === 'palette')  return togglePop('pop-palette', btn);
      if (act === 'download') {
        if (isCanvasEmpty()) { showEmptyToast(); return; }
        return togglePop('pop-download', btn);
      }
      if (act === 'share') {
        if (isCanvasEmpty()) { showEmptyToast(); return; }
        closeAllPopovers();
        document.getElementById('modal-share').hidden = false;
        return;
      }
      closeAllPopovers();
      if (act === 'zoomIn' || act === 'zoomOut') {
        var levels = [1, 1.5, 2, 3];
        if (act === 'zoomIn' && zoomIdx < levels.length - 1) zoomIdx++;
        if (act === 'zoomOut' && zoomIdx > 0) zoomIdx--;
        var z = levels[zoomIdx];
        document.querySelector('.canvas-wrap').style.transform = 'scale(' + z + ')';
        document.querySelector('[data-action="zoomIn"]').classList.toggle('active', z > 1);
        document.querySelector('[data-action="zoomOut"]').classList.toggle('active', z > 1);
        return;
      }
      if (act === 'undo') {
        if (undoStack.length) { grid = undoStack.pop(); render(); }
        return;
      }
      if (act === 'clear') {
        if (confirm('¿Borrar todo el diseño?')) { saveUndo(); makeGrid(); render(); }
        return;
      }
      if (act === 'mirrorH') {
        mirrorHActive = !mirrorHActive;
        if (mirrorHActive) {
          mirrorVActive = false;
          document.querySelector('[data-action="mirrorV"]').classList.remove('active');
        }
        btn.classList.toggle('active', mirrorHActive);
        return;
      }
      if (act === 'mirrorV') {
        mirrorVActive = !mirrorVActive;
        if (mirrorVActive) {
          mirrorHActive = false;
          document.querySelector('[data-action="mirrorH"]').classList.remove('active');
        }
        btn.classList.toggle('active', mirrorVActive);
        return;
      }
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.popover') && !e.target.closest('.side-btn')) closeAllPopovers();
  });

  // Re-renderizar al redimensionar (sin cambiar el grid para preservar dibujo)
  new ResizeObserver(function () { render(); }).observe(document.querySelector('.canvas-area'));

  // Paletas
  var paletteMap = {
    '1': { bg: getComputedStyle(document.documentElement).getPropertyValue('--sacbe').trim(),   fg: '#000000' },
    '2': { bg: getComputedStyle(document.documentElement).getPropertyValue('--magenta').trim(), fg: '#000000' },
    '3': { bg: getComputedStyle(document.documentElement).getPropertyValue('--durazno').trim(), fg: '#000000' },
    '4': { bg: getComputedStyle(document.documentElement).getPropertyValue('--cian').trim(),    fg: '#000000' }
  };
  document.querySelectorAll('.swatch').forEach(function (sw) {
    sw.addEventListener('click', function (e) {
      e.stopPropagation();
      document.querySelectorAll('.swatch').forEach(function (s) { s.classList.remove('active'); });
      sw.classList.add('active');
      var p = paletteMap[sw.dataset.pal];
      document.documentElement.style.setProperty('--paint-bg', p.bg);
      document.documentElement.style.setProperty('--paint-fg', p.fg);
      render();
    });
  });

  // Descargar SVG
  document.getElementById('dl-svg').addEventListener('click', function () {
    var svg = document.getElementById('grid-svg');
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--paint-bg').trim();
    var clone = svg.cloneNode(true);
    var contentW = (cols - 1) * 2 * CS;
    var contentH = (rows - 1) * CS;
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', contentW);
    clone.setAttribute('height', contentH);
    clone.setAttribute('viewBox', '0 0 ' + contentW + ' ' + contentH);
    clone.removeAttribute('preserveAspectRatio');
    var bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bgRect.setAttribute('x', '0'); bgRect.setAttribute('y', '0');
    bgRect.setAttribute('width', contentW); bgRect.setAttribute('height', contentH);
    bgRect.setAttribute('fill', bg);
    clone.insertBefore(bgRect, clone.firstChild);
    var blob = new Blob([clone.outerHTML], { type: 'image/svg+xml' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mi-diseno-textil.svg';
    a.click();
    URL.revokeObjectURL(a.href);
    closeAllPopovers();
  });

  // Descargar JPG
  document.getElementById('dl-jpg').addEventListener('click', function () {
    var svg = document.getElementById('grid-svg');
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--paint-bg').trim();
    var contentW = (cols - 1) * 2 * CS;
    var contentH = (rows - 1) * CS;
    var scale = 2;
    var canvas = document.createElement('canvas');
    canvas.width = contentW * scale;
    canvas.height = contentH * scale;
    var ctx = canvas.getContext('2d');
    var clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', contentW * scale);
    clone.setAttribute('height', contentH * scale);
    clone.setAttribute('viewBox', '0 0 ' + contentW + ' ' + contentH);
    clone.removeAttribute('preserveAspectRatio');
    var bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bgRect.setAttribute('x', '0'); bgRect.setAttribute('y', '0');
    bgRect.setAttribute('width', contentW); bgRect.setAttribute('height', contentH);
    bgRect.setAttribute('fill', bg);
    clone.insertBefore(bgRect, clone.firstChild);
    var data = new Blob([clone.outerHTML], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(data);
    var img = new Image();
    img.onload = function () {
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      var a = document.createElement('a');
      a.href = canvas.toDataURL('image/jpeg', 0.95);
      a.download = 'mi-diseno-textil.jpg';
      a.click();
      closeAllPopovers();
    };
    img.src = url;
  });

  // Cerrar modal
  document.getElementById('modal-share-close').addEventListener('click', function () {
    document.getElementById('modal-share').hidden = true;
  });
  document.getElementById('modal-share').addEventListener('click', function (e) {
    if (e.target.id === 'modal-share') document.getElementById('modal-share').hidden = true;
  });

  // Cerrar overlay
  document.getElementById('btn-close').addEventListener('click', function () {
    document.getElementById('overlay').classList.add('collapsed');
  });
  document.getElementById('bookmark').addEventListener('click', function () {
    document.getElementById('overlay').classList.remove('collapsed');
  });
})();
</script>
</body>
</html>
