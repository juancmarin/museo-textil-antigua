<body class="page hero">
  <main class="layout">
    <!-- ============ Columna izquierda: motivo textil ============ -->
    <aside class="visual" aria-hidden="true">
      <!-- Motivo textil animado (GIF) de la Home -->
      <img
        class="visual__art"
        src="assets/motivo-textil.gif"
        alt=""
        draggable="false"
        oncontextmenu="return false"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
      />
      <svg class="visual__fallback" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" role="presentation">
        <defs>
          <pattern id="huipil" width="50" height="50" patternUnits="userSpaceOnUse">
            <rect width="50" height="50" fill="transparent" />
            <path d="M25 3 L47 25 L25 47 L3 25 Z" fill="#000" />
            <path d="M25 14 L36 25 L25 36 L14 25 Z" fill="#e8e5d9" />
            <rect x="22" y="22" width="6" height="6" fill="#000" />
          </pattern>
        </defs>
        <rect width="300" height="300" fill="url(#huipil)" />
      </svg>
    </aside>

    <!-- ============ Columna derecha: contenido ============ -->
    <div class="content">
      <nav class="nav nav--stacked" aria-label="Navegación principal">
        <a class="nav__link" href="conocenos.html">Conócenos</a>
        <a class="nav__link" href="siguenos.html">Síguenos</a>
      </nav>

      <div class="content__body content__body--center">
        <div class="brand brand--hero brand--orange">
          <!-- Asset de marca: exportar como assets/wordmark-naranja.svg (mosaico naranja) -->

            class="brand__wordmark"
            src="assets/wordmark-naranja.svg"
            alt="MuTex"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
          />
          <span class="brand__fallback" aria-hidden="true">MU<br />TEX</span>
        </div>

        <h1 class="headline headline--center">¡El Museo Textil de Antigua pronto abrirá sus puertas!</h1>
      </div>

      <!-- ============ Footer ============ -->
      <footer class="footer">
        <ul class="social" aria-label="Redes sociales">
          <li><a class="social__link" href="https://www.instagram.com/museotextilantigua" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg></a></li>

          <li><a class="social__link" href="mailto:contacto@museotextildeantigua.com" aria-label="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5" stroke-linejoin="round"/></svg></a></li>
